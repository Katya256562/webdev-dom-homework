<!DOCTYPE html>
<html>
<head>
    <title>Проект "Комменты"</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <div class="container">
        <ul class="comments"></ul>
        <div class="add-form">
            <input type="text" class="add-form-name" placeholder="Введите ваше имя" />
            <textarea type="textarea" class="add-form-text" placeholder="Введите ваш коментарий" rows="4"></textarea>
            <div class="add-form-row">
                <button class="add-form-button">Написать</button>
            </div>
        </div>
    </div>

    <script>
        "use strict";

        const nameInput = document.querySelector('.add-form-name');
        const commentInput = document.querySelector('.add-form-text');
        const addButton = document.querySelector('.add-form-button');
        const commentsList = document.querySelector('.comments');

        let comments = [];

        function renderComments() {
            commentsList.innerHTML = '';
            comments.forEach((comment, index) => {
                const commentElement = `
                    <li class="comment" data-index="${index}">
                        <div class="comment-header">
                            <div>${comment.name}</div>
                            <div>${comment.date}</div>
                        </div>
                        <div class="comment-body">
                            <div class="comment-text">${comment.text}</div>
                        </div>
                        <div class="comment-footer">
                            <div class="likes">
                                <span class="likes-counter">${comment.likes}</span>
                                <button class="like-button ${comment.isLiked ? '-active-like' : ''}" data-index="${index}"></button>
                            </div>
                        </div>
                    </li>`;
                commentsList.innerHTML += commentElement;
            });
            attachLikeHandlers();
            attachCommentClickHandlers();
        }

        function addComment() {
            const name = sanitizeInput(nameInput.value.trim());
            const commentText = sanitizeInput(commentInput.value.trim());

            if (name === '' || commentText === '') {
                alert('Пожалуйста, заполните все поля.');
                return;
            }

            const currentDate = new Date();
            const dateString = currentDate.toLocaleString();

            comments.push({
                name: name,
                text: commentText,
                date: dateString,
                likes: 0,
                isLiked: false
            });

            renderComments();

            nameInput.value = '';
            commentInput.value = '';
        }

        function toggleLike(index) {
            const comment = comments[index];
            if (comment.isLiked) {
                comment.likes -= 1;
                comment.isLiked = false;
            } else {
                comment.likes += 1;
                comment.isLiked = true;
            }
            renderComments();
        }

        function attachLikeHandlers() {
            const likeButtons = document.querySelectorAll('.like-button');
            likeButtons.forEach(button => {
                button.addEventListener('click', (event) => {
                    event.stopPropagation();
                    const index = button.getAttribute('data-index');
                    toggleLike(index);
                });
            });
        }

        function attachCommentClickHandlers() {
            const commentItems = document.querySelectorAll('.comment');
            commentItems.forEach(item => {
                item.addEventListener('click', () => {
                    const index = item.getAttribute('data-index');
                    const comment = comments[index];
                    nameInput.value = comment.name;
                    commentInput.value = `> ${comment.text}`;
                });
            });
        }

        function sanitizeInput(input) {
            return input.replaceAll(/&/g, "&amp;")
                        .replaceAll(/</g, "&lt;")
                        .replaceAll(/>/g, "&gt;")
                        .replaceAll(/"/g, "&quot;")
                        .replaceAll(/'/g, "&#039;");
        }

        addButton.addEventListener('click', addComment);
    </script>

</body>
</html>
